name: python build wheels

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ master ]

env:
  FORCE_COLOR: 3

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive  # the sdist carries the Mbed TLS sources (sdist.include in pyproject.toml)

    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Build SDist
      run: pipx run build --sdist

    - name: Check metadata
      run: pipx run twine check dist/*

    - uses: actions/upload-artifact@v7
      with:
        name: wheelhouse-sdist
        path: dist/*.tar.gz
        overwrite: true

  build_wheels:
    name: Wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Build wheels
      uses: pypa/cibuildwheel@v4.3.1
      env:
        MACOSX_DEPLOYMENT_TARGET: "10.13"
        CIBW_ARCHS_MACOS: universal2
        # Wheel layout (one build per platform for each row):
        #   cp39-abi3        every GIL-enabled Python from 3.9 up (py-api = "cp39" in pyproject.toml).
        #   cp313t / cp314t  free-threaded: abi3 cannot be loaded by free-threaded builds, so each gets its own
        #                    wheel. cp313t comes from the separate cibuildwheel 3.x step below, because
        #                    cibuildwheel 4.x dropped 3.13 free-threading.
        #   cp315t           free-threaded 3.15: abi3t (PEP 803) would replace this, but it needs the PEP 793 export
        #                    hook, which released Cython versions do not generate yet.
        CIBW_BUILD: "cp39-* cp314t-* cp315t-*"
        # rpds-py (pulled in by jsonschema at build time) has no free-threaded wheel in its newest release:
        # prefer an older binary over compiling the newest sdist with Rust.
        CIBW_ENVIRONMENT: PIP_PREFER_BINARY=1

    - name: Build wheels (free-threaded 3.13)
      uses: pypa/cibuildwheel@v3.4.1
      env:
        MACOSX_DEPLOYMENT_TARGET: "10.13"
        CIBW_ARCHS_MACOS: universal2
        CIBW_BUILD: "cp313t-*"
        CIBW_ENABLE: cpython-freethreading
        CIBW_ENVIRONMENT: PIP_PREFER_BINARY=1
        CIBW_SKIP: pp*

    - uses: actions/upload-artifact@v7
      with:
        name: wheelhouse-${{ matrix.os }}
        path: wheelhouse/*.whl
        overwrite: false
