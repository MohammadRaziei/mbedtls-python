name: Orchestration & Release

# push to master  -> build everything, refresh the `__beta__` pre-release
# push of a v* tag -> the same, then a real GitHub release and PyPI (the tag must match `python version.py`)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.init.outputs.release_name }}
      is_tag: ${{ steps.init.outputs.is_tag }}
      version_string: ${{ steps.init.outputs.version_string }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initalize
        id: init
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export version_string="$(python version.py | tr -d '\n')"
          echo "version_string=${version_string}" | tee -a "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" =~ ^refs/tags/v.*$ ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            [[ "${version_string}" == "${GITHUB_REF#refs/tags/v}" ]] || (echo "❌ Version mismatch!" && exit 1)
            export release_name="$TAG_NAME"
            export is_tag="true"
          else
            gh api repos/${{ github.repository }}/releases/tags/__beta__ --jq '.assets[].id' 2>/dev/null | xargs -r -I {} gh api repos/${{ github.repository }}/releases/assets/{} -X DELETE 2>/dev/null || true
            export release_name="__beta__"
            export is_tag="false"
          fi
          echo "release_name=${release_name}" | tee -a "$GITHUB_OUTPUT"
          echo "is_tag=${is_tag}" | tee -a "$GITHUB_OUTPUT"
          sed -i -e "s/RELEASE_NAME/${release_name}/g" -e "s/VERSION_STRING/${version_string}/g" .github/workflows/release_template.md

      - name: Initialize release body
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.init.outputs.release_name }}
          name: ${{ steps.init.outputs.release_name }}
          draft: false
          prerelease: ${{ steps.init.outputs.is_tag == 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: .github/workflows/release_template.md

  cmake:
    uses: ./.github/workflows/cmake.yml
    needs: [init]

  prebuilt:
    uses: ./.github/workflows/prebuilt.yml
    needs: [init]

  wheel:
    uses: ./.github/workflows/wheels.yml
    needs: [init]

  # Nothing is published unless the C++ tests (incl. ThreadSanitizer), the prebuilt package and every wheel passed.
  release:
    needs: [init, cmake, prebuilt, wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Download wheels and sdist
        uses: actions/download-artifact@v8
        with:
          pattern: wheelhouse-*
          path: dist
          merge-multiple: true

      - name: Download prebuilt cores
        uses: actions/download-artifact@v8
        with:
          pattern: prebuilt-*
          path: prebuilt
          merge-multiple: true

      # Safety net: the PyPI step takes dist/ as it is, so it must hold only flat *.whl / *.tar.gz files.
      - name: Check layout
        run: |
          if find dist prebuilt -mindepth 1 -type d | grep -q .; then
            echo "::error::unexpected sub-directories"; find dist prebuilt; exit 1
          fi
          ls -lh dist prebuilt

      - name: Upload to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.init.outputs.release_name }}
          name: ${{ needs.init.outputs.release_name }}
          draft: false
          prerelease: ${{ needs.init.outputs.is_tag == 'false' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/*
            prebuilt/*
          generate_release_notes: true

      - name: Publishing to PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          password: ${{ secrets.PYPI_PASSWORD }}
          user: ${{ secrets.PYPI_USERNAME }}
          packages-dir: dist
          skip-existing: true
          # attestations need Trusted Publishing; they are ignored when a password is used
          attestations: false
