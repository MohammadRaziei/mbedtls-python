[build-system]
requires = [
    "scikit-build-core>=1.1",
    "cython>=3.1",  # freethreading_compatible, automatic limited API
    "cython-cmake",
    "jsonschema",  # jsonschema + jinja2: Mbed TLS's make_generated_files.py (see CMakeLists.txt)
    "jinja2",
]
build-backend = "scikit_build_core.build"

[project]
name = "mbedtls"
version = "0.2.0"
description = "Python bindings for Mbed TLS: thread-safe, one abi3 wheel for CPython 3.9+, with the C++ SDK (shared library) inside"
authors = [
    {name = "Mohammad Raziei", email = "mohammadraziei1375@gmail.com"},
]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 1 - Unstable",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
mbedtls = "mbedtls.__main__:cli"

[project.urls]
"Homepage" = "https://github.com/MohammadRaziei/mbedtls-python"
"Bug Tracker" = "https://github.com/MohammadRaziei/mbedtls-python/issues"
"Changelog" = "https://github.com/MohammadRaziei/mbedtls-python/blob/master/CHANGELOG.md"

[tool.scikit-build.cmake]
version = ">=3.26"
build-type = "Release"

[tool.scikit-build.cmake.define]
MBEDTLS_CPP_BUILD_PYTHON = "ON"
MBEDTLS_CPP_BUILD_TESTS = "OFF"

# Stable ABI: one cp39-abi3 wheel per platform works on every GIL-enabled CPython from 3.9 up. Free-threaded
# Python cannot load abi3 wheels, so CI builds cp313t, cp314t and cp315t separately (scikit-build-core ignores
# py-api for them). See .github/workflows/wheels.yml.
[tool.scikit-build.wheel]
py-api = "cp39"
packages = []  # the package files are installed by CMake (install(DIRECTORY ...)), not auto-collected
# Mbed TLS's own install also writes things the wheel does not need: the historical libmbedcrypto.* (a second copy of
# tfpsacrypto), pkg-config files, and the TF-PSA-Crypto CMake package (MbedTLS's package is self-contained). A plain
# `cmake --install` keeps them; only the wheel leaves them out.
exclude = [
    "mbedtls/sdk/lib/*mbedcrypto*",
    "mbedtls/sdk/lib/pkgconfig",
    "mbedtls/sdk/lib/cmake/TF-PSA-Crypto",
]

[tool.scikit-build]
# The submodule is not tracked by this repo, so the sdist must be told to carry it (with its own nested submodules).
sdist.include = ["src/third_party/mbedtls/**/*"]

[tool.scikit-build.install]
strip = true

[tool.cibuildwheel]
skip = "*i686*"
test-command = "pytest {project}/tests -o faulthandler_timeout=120"
test-extras = ["test"]

[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

# The Mbed TLS DLLs already sit in the wheel, in mbedtls/sdk/lib, and is registered with
# os.add_dll_directory by mbedtls/__init__.py: there is nothing for delvewheel to bundle. cibuildwheel 4.x runs it on
# Windows by default.
[tool.cibuildwheel.windows]
repair-wheel-command = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
faulthandler_timeout = 120
